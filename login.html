<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - NCCPA Jankalyan Foundation</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa, #e8f5e9);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #fff;
      padding: 30px 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: #198754;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      color: #198754;
      margin: 5px 0;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #198754;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
    }

    .links {
      text-align: center;
      margin-top: 20px;
      line-height: 2;
    }

    .links a {
      color: #198754;
      text-decoration: none;
      font-weight: bold;
    }

    .back {
      display: block;
      margin-top: 12px;
      color: #555 !important;
      font-weight: normal !important;
    }
  </style>
</head>

<body>

<div class="login-box">

  <div class="logo">N</div>

  <h1>NCCPA Login</h1>

  <div class="subtitle">
    NCCPA Jankalyan Foundation
    <br>
    National Council for Community Promotion & Awareness
  </div>

  <form id="loginForm">

    <label for="email">ईमेल / Login ID</label>
    <input
      type="email"
      id="email"
      placeholder="अपना ईमेल दर्ज करें"
      required
    >

    <label for="password">पासवर्ड</label>
    <input
      type="password"
      id="password"
      placeholder="अपना पासवर्ड दर्ज करें"
      required
    >

    <button id="loginButton" type="submit">
      🔐 Login
    </button>

  </form>

  <div id="message" class="message"></div>

  <div class="links">
    <a href="volunteer-registration.html">
      Volunteer Registration
    </a>

    <br>

    <a href="member-registration.html">
      Member Registration
    </a>

    <a href="index.html" class="back">
      ← मुख्य पेज पर वापस जाएँ
    </a>
  </div>

</div>

<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCVzqjczfUEUXWUnPUxEaeK9r4stLYO3yM",
    authDomain: "nccpa-jankalyan-foundation.firebaseapp.com",
    projectId: "nccpa-jankalyan-foundation",
    storageBucket: "nccpa-jankalyan-foundation.firebasestorage.app",
    messagingSenderId: "940800992827",
    appId: "1:940800992827:web:10e2e4fd72fcd217f91e1e",
    measurementId: "G-7XDFLZVV0K"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const form = document.getElementById("loginForm");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const message = document.getElementById("message");
  const loginButton = document.getElementById("loginButton");

  form.addEventListener("submit", async function(e) {

    e.preventDefault();

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    message.style.color = "#555";
    message.textContent = "Login हो रहा है...";
    loginButton.disabled = true;

    try {

      const userCredential =
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      const user = userCredential.user;

      message.style.color = "#198754";
      message.textContent = "Login सफल! Dashboard खोला जा रहा है...";

      /*
       * अभी हम Firebase Authentication से Login कर रहे हैं।
       * अगला Step Firestore से role पढ़कर
       * Admin / Volunteer / Member Dashboard पर भेजना होगा।
       */

      setTimeout(() => {
        window.location.href = "admin-dashboard.html";
      }, 1000);

    } catch (error) {

      message.style.color = "#dc3545";

      if (error.code === "auth/invalid-credential") {
        message.textContent =
          "ईमेल या पासवर्ड गलत है।";
      } else if (error.code === "auth/user-not-found") {
        message.textContent =
          "यह User मौजूद नहीं है।";
      } else if (error.code === "auth/wrong-password") {
        message.textContent =
          "पासवर्ड गलत है।";
      } else {
        message.textContent =
          "Login असफल: " + error.message;
      }

      loginButton.disabled = false;
    }

  });

</script>

</body>
</html>
