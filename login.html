<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - NCCPA Jankalyan Foundation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa, #e8f5e9);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #fff;
      padding: 30px 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: #198754;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      color: #198754;
      margin: 5px 0;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #198754;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #198754;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #146c43;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
    }

    .links {
      text-align: center;
      margin-top: 20px;
      line-height: 2;
    }

    .links a {
      color: #198754;
      text-decoration: none;
      font-weight: bold;
    }

    .back {
      display: block;
      margin-top: 12px;
      color: #555 !important;
      font-weight: normal !important;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">N</div>

    <h1>NCCPA Login</h1>

    <div class="subtitle">
      NCCPA Jankalyan Foundation
      <br>
      National Council for Community Promotion & Awareness
    </div>

    <form id="loginForm">

      <label for="email">ईमेल / Login ID</label>

      <input
        type="email"
        id="email"
        placeholder="अपना ईमेल दर्ज करें"
        required
      >

      <label for="password">पासवर्ड</label>

      <input
        type="password"
        id="password"
        placeholder="अपना पासवर्ड दर्ज करें"
        required
      >

      <button type="submit" id="loginBtn">
        🔐 Login
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="links">

      <a href="volunteer-registration.html">
        Volunteer Registration
      </a>

      <br>

      <a href="member-registration.html">
        Member Registration
      </a>

      <a href="index.html" class="back">
        ← मुख्य पेज पर वापस जाएँ
      </a>

    </div>

  </div>


  <!-- Firebase Login -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      query,
      where,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // Firebase Configuration

    const firebaseConfig = {
      apiKey: "AIzaSyCVzqjczfUEUXWUnPUxEaeK9r4stLYO3yM",
      authDomain: "nccpa-jankalyan-foundation.firebaseapp.com",
      projectId: "nccpa-jankalyan-foundation",
      storageBucket: "nccpa-jankalyan-foundation.firebasestorage.app",
      messagingSenderId: "940800992827",
      appId: "1:940800992827:web:10e2e4fd72fcd217f91e1e",
      measurementId: "G-7XDFLZVV0K"
    };


    // Firebase Start

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    // Login Form

    document
      .getElementById("loginForm")
      .addEventListener("submit", async function(e) {

        e.preventDefault();

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        const message =
          document.getElementById("message");

        const loginBtn =
          document.getElementById("loginBtn");


        message.style.color = "#333";

        message.textContent = "Login हो रहा है...";

        loginBtn.disabled = true;


        try {

          // Firebase Authentication Login

          const userCredential =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            userCredential.user;


          // Firestore में Email से User खोजें

          const q = query(
            collection(db, "users"),
            where("email", "==", user.email)
          );


          const snapshot =
            await getDocs(q);


          // User नहीं मिला

          if (snapshot.empty) {

            message.style.color = "red";

            message.textContent =
              "Firestore में इस Email का User नहीं मिला।";

            loginBtn.disabled = false;

            return;
          }


          // User Data

          const userData =
            snapshot.docs[0].data();


          // Role प्राप्त करें

          const role =
            (userData.role || "")
            .trim()
            .toLowerCase();


          message.style.color = "#198754";

          message.textContent =
            "Login सफल! Dashboard खोला जा रहा है...";


          // Role के अनुसार Dashboard

          if (role === "admin") {

            window.location.href =
              "admin-dashboard.html";

          }

          else if (role === "volunteer") {

            window.location.href =
              "volunteer-dashboard.html";

          }

          else if (role === "member") {

            window.location.href =
              "member-dashboard.html";

          }

          else {

            message.style.color = "red";

            message.textContent =
              "User Role सही नहीं है।";

            loginBtn.disabled = false;
          }


        }

        catch (error) {

          console.error(error);

          message.style.color = "red";


          if (
            error.code ===
            "auth/invalid-credential"
          ) {

            message.textContent =
              "ईमेल या पासवर्ड गलत है।";

          }

          else if (
            error.code ===
            "auth/invalid-email"
          ) {

            message.textContent =
              "ईमेल सही नहीं है।";

          }

          else {

            message.textContent =
              "Login में समस्या हुई: " +
              error.message;
          }


          loginBtn.disabled = false;

        }

      });

  </script>

</body>
</html>
